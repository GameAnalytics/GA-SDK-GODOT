name: SCons Build

on:
  workflow_call:
    inputs:
      configs:
        description: 'JSON array of configs to build (e.g. ["debug","release"])'
        default: '["debug","release"]'
        required: false
        type: string
      upload_artifacts:
        description: 'Whether to upload the built addon as a workflow artifact'
        default: true
        required: false
        type: boolean

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.config }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
        config: ${{ fromJSON(inputs.configs) }}
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            scons-${{ matrix.platform }}-${{ matrix.config }}-

      - name: Build
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          ARCH_FLAG=""
          if [ "${{ matrix.platform }}" == "macos" ]; then
            ARCH_FLAG="--arch arm64"
          fi
          python build.py ${{ matrix.platform }} ${{ matrix.config }} $ARCH_FLAG

      - name: Upload build artifact
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: godotgameanalytics-${{ matrix.platform }}-${{ matrix.config }}
          path: example/addons/GameAnalytics/
          retention-days: 7
