name: Create Release
run-name: Godot SDK Release ${{ inputs.tag_name }}

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/scons-build.yml
    with:
      configs: '["release"]'
      upload_artifacts: true

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags and commits

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: godotgameanalytics-*-release

      - name: Assemble addon
        run: |
          set -e
          mkdir -p release/addons/GameAnalytics
          cp -r artifacts/godotgameanalytics-linux-release/. release/addons/GameAnalytics/
          cp -f artifacts/godotgameanalytics-linux-release/bin/linux/libGodotGameAnalytics.so release/addons/GameAnalytics/bin/linux/libGodotGameAnalytics.so
          cp -f artifacts/godotgameanalytics-windows-release/bin/windows/libGodotGameAnalytics.dll release/addons/GameAnalytics/bin/windows/libGodotGameAnalytics.dll
          cp -f artifacts/godotgameanalytics-macos-release/bin/macos/libGodotGameAnalytics.dylib release/addons/GameAnalytics/bin/macos/libGodotGameAnalytics.dylib
          cp -f artifacts/godotgameanalytics-web-release/bin/web/libGodotGameAnalytics.wasm release/addons/GameAnalytics/bin/web/libGodotGameAnalytics.wasm
          cp -f artifacts/godotgameanalytics-web-release/web/GameAnalytics.js release/addons/GameAnalytics/web/GameAnalytics.js

      - name: Zip addon
        run: |
          cd release && zip -r ../GameAnalytics-Godot-${{ inputs.tag_name }}.zip addons

      - name: Set up Git credentials
        run: |
          git config user.name "ga-sdk-release[bot]"
          git config user.email "ga-sdk-release[bot]@noreply.gameanalytics.com"

      - name: Push tag ${{ inputs.tag_name }}
        run: |
          git tag ${{ inputs.tag_name }}
          git push origin ${{ inputs.tag_name }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Release GA-SDK-GODOT ${{ inputs.tag_name }}
          generate_release_notes: true
          make_latest: true
          files: GameAnalytics-Godot-${{ inputs.tag_name }}.zip
